# Force local Gradle compilation boundaries to target Java 17 safely
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr

# Disable background daemon retention to prevent Gradle 9.0 overrides
org.gradle.daemon=false
org.gradle.configureondemand=false
org.gradle.caching=false

# Enable AndroidX support across the compilation runtime
android.useAndroidX=true
android.enableJetifier=true
android.prefabEnabled=true

# Suppress non-fatal build tool SDK parsing version differences
android.suppressUnsupportedCompileSdk=34

# Allocate 4GB of RAM to the Gradle JVM compiler thread
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError

# Force parallel garbage collection to minimize footprint bottlenecks
org.gradle.parallel=true